# Impostazioni di pubblicazione su Netlify
# Il sito è fatto di file statici: non serve nessun comando di build.
[build]
  publish = "."

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Statistiche anonime: il file vuoto non va tenuto in memoria dal browser,
# così ogni evento arriva al server e viene contato
[[headers]]
  for = "/s.gif"
  [headers.values]
    Cache-Control = "no-store"
